<!doctype html>
<html lang="{{ or site.Language.Lang "en" }}" dir="{{ .Language.Direction | default "ltr" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  {{- partial "topbar.html" . -}}
  <main id="content">
    {{- block "main" . }}{{ end -}}
  </main>
  {{- partial "footer.html" . -}}
  {{- partial "analytics.html" . -}}
</body>
</html>
