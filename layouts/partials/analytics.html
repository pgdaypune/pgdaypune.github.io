{{- if hugo.IsProduction | or (eq site.Params.env "production") -}}
{{- with site.Config.Services.GoogleAnalytics.ID -}}
<script>
  /* GA4 kept off the critical path: tag is configured immediately but the
     remote library is fetched only when the browser is idle (never blocks LCP). */
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', '{{ . }}');
  function loadGA(){ var s=document.createElement('script'); s.async=1;
    s.src='https://www.googletagmanager.com/gtag/js?id={{ . }}'; document.head.appendChild(s); }
  if ('requestIdleCallback' in window) { requestIdleCallback(loadGA, { timeout: 4000 }); }
  else { addEventListener('load', function(){ setTimeout(loadGA, 1200); }); }
</script>
{{- end -}}
{{- end -}}
