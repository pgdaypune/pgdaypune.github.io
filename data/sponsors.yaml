# `logo` is the light-mode artwork (dark/brand-colour). Add an optional `logo-dark`
# (white/light variant) and it swaps in automatically under the dark theme — live,
# no page reload. When `logo-dark` is absent, `logo` is used in both themes.
# `height` is the rendered logo height in px inside its card (applies to `logo`).
# Add an optional `height-dark` to size the dark-mode logo differently — useful
# when the two artworks have different internal padding. Falls back to `height`.
categories:
  - name: "PGConf India Diamond Sponsors"
    class: "diamond"
    sponsors:
      - name: "AWS"
        logo: "/images/sponsors/aws.png"
        height: 70
        logo-dark: "/images/sponsors/aws-dark.svg"
        height-dark: 45
        url: "https://aws.amazon.com/"
      - name: "EDB"
        logo: "/images/sponsors/edb.svg"
        logo-dark: "/images/sponsors/edb-dark.svg"
        url: "https://www.enterprisedb.com/"
        height: 45
      - name: "Google Cloud"
        logo: "/images/sponsors/google-cloud.png"
        url: "https://cloud.google.com/"
        height: 40
      - name: "Microsoft"
        logo: "/images/sponsors/microsoft.png"
        url: "https://www.microsoft.com/"
        height: 50

  - name: "Star Sponsors"
    class: "star"
    sponsors:
      - name: "Supabase"
        logo: "/images/sponsors/supabase.png"
        logo-dark: "/images/sponsors/supabase-dark.png"
        url: "https://supabase.com/"
        height: 40

  - name: "Gold Sponsors"
    class: "gold"
    sponsors:
      - name: "Percona"
        logo: "/images/sponsors/percona.svg"
        logo-dark: "/images/sponsors/percona-dark.svg"
        url: "https://www.percona.com/"
        height: 35

