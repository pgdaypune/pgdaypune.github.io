# Logos are dark-mode variants (white/brand-colour on transparent) so they read
# on the site's dark theme. `height` is the rendered logo height in px inside its
# card — tuned per logo so wordmarks and square icon-marks sit at a similar weight.
categories:
  - name: "PGConf India Diamond Sponsors"
    class: "diamond"
    sponsors:
      - name: "AWS"
        logo: "/images/sponsors/aws.svg"
        url: "https://aws.amazon.com/"
        height: 45
      - name: "EDB"
        logo: "/images/sponsors/edb.svg"
        url: "https://www.enterprisedb.com/"
        height: 45
      - name: "Google Cloud"
        logo: "/images/sponsors/google-cloud.png"
        url: "https://cloud.google.com/"
        height: 40
      - name: "Microsoft"
        logo: "/images/sponsors/microsoft.png"
        url: "https://www.microsoft.com/"
        height: 70

