# =============================================================================
# Current edition — the single source of truth for the homepage (fact bar,
# countdown, community stats, CFP band) and the JSON-LD Event schema.
# Read in templates via hugo.Data.event.
# =============================================================================
name: "Postgres Pune"
number: 6

# RFC3339 with the +05:30 offset. startTime drives the countdown + JSON-LD.
startTime: "2026-10-09T08:30:00+05:30"
endTime:   "2026-10-09T18:00:00+05:30"

venue: "St Laurn - Koregaon Park"                 # empty -> "To be announced" (rendered in --gold)
venueMapURL: "https://maps.app.goo.gl/F6uMfXfZ38TtkvZJ7"           # Google Maps link; a static map + link show once set
venueIframeURL: "https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d3782.7858735612995!2d73.8859192!3d18.538576!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2c0fc2b2b56db%3A0x76b21edc396aa13!2sSt%20Laurn%20-%20Koregaon%20Park%2C%20Pune!5e0!3m2!1sen!2sin!4v1786431663529!5m2!1sen!2sin"

# Show the tentative schedule alongside community on the home page.
# Set true once the agenda is ready to be showcased.
showSchedule: false

# CFP / registration status (drives the /call-for-papers/ and /register/ pages).

cfpOpen: true
cfpURL: "https://confbase.io/pgpune/pgpune-event-6/cfp"  # replace with the real CFP URL when it opens
talkFormat: "(~40 mins)"
cfpDeadline: "2026-09-07"           # e.g. "2026-08-15"; empty -> "TBA"
cfpNotification: "2026-09-14"  # e.g. "2026-09-14"; empty -> "TBA"
cfpAlert: "The call for papers isn't open yet — check back soon. 🐘" # Visible when cfpOpen: false && cfpURL: "added"

registrationOpen: true
registerURL: "/register/"
registrationAlert: "Registration isn't open yet — check back soon. 🐘"
entryURL: "https://confbase.io/embed/pgpune/pgpune-event-6/tickets" # if set, the Entry value links here (e.g. a ticketing page)
ticketsIframe: <iframe src="https://confbase.io/embed/pgpune/pgpune-event-6/tickets?theme=dark" width="100%" height="900" frameborder="0" style="border:0;border-radius:8px;" allow="payment *" loading="lazy" title="PgPune Event 6 - tickets"></iframe>
ticketsNote: |
  Note: Tickets are managed via <a href="https://confbase.io/" target="_blank" class="fact__v--link">Confbase.io</a>. If you face any issues booking above ^, try booking directly from <a href="https://confbase.io/pgpune/pgpune-event-6/tickets" target="_blank" class="fact__v--link">Confbase here →</a>
ticketsCoupon: |
  Hurry, apply coupon **`EARLYBIRD20`** and save 20% before it's gone!
stats:
  editions: 5
  talks: "28+"
