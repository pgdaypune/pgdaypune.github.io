- name: "Debendra Saha"
  org: Newt Global
  image: "/images/speakers/icons/debendra-saha.png"
  linkedin: "https://www.linkedin.com/in/debendra-saha-60773715"
  events: [6]
  bio: |
    Debendra Saha is a seasoned technology and delivery leader with over 32 years of experience in application and product development across Manufacturing, FMCG/CPG, Travel, and Telecom, serving customers across the US, UK, Europe, the Middle East, APAC, Africa, and India. Over the past 18+ years in the telecom domain, he has held senior roles including Program Director, Program Manager, and Delivery Head, owning end-to-end program and delivery management, governance, and P&L. A key focus of his recent work is database modernization, where he has led several Oracle and SQL Server to PostgreSQL migration programs in close collaboration with leading hyperscalers including AWS, Microsoft Azure, and Google Cloud. Bringing deep expertise across Oracle databases, Java/J2EE, DevOps, and cloud technologies, grounded in CMMi, PMI, and Prince practices, Debendra was also selected as a Global Leader in Tech Mahindra's 1000 Leaders Program.
- name: "Anuj Sharma"
  org: Newt Global
  image: "/images/speakers/icons/anuj-sharma.png"
  linkedin: "https://www.linkedin.com/in/anuj-sharma-61779757"
  events: [6]
  bio: |
    Anuj Sharma is a Senior Database Architect with over 22 years of experience designing, deploying, and managing enterprise-scale data ecosystems. He has led large-scale database migrations and modernization efforts, including a shift from proprietary Oracle systems to open-source PostgreSQL and cloud platforms, while ensuring scalability for millions of concurrent users. A Google Cloud Certified Professional Cloud Database Engineer, Anuj brings deep expertise across the PostgreSQL ecosystem, NoSQL, and Big Data platforms, along with a strong focus on data governance, performance optimization, and cross-functional technical leadership.
- name: "Hari Kiran"
  org: OpenSource DB
  image: "/images/speakers/icons/hari-kiran.jpeg"
  linkedin: "https://www.linkedin.com/in/hari-kiran-pg/"
  events: [5, 6]
  bio: |
    Hari Kiran is the Chief PostgreSQL Solutions Architect specializing in solution engineering for large-scale enterprise and government systems. He currently leads solution architecture for the Insight 2.0 program, CBDT's seven-year modernization of India's national tax analytics platform, owning design, whiteboarding, data flow, and data modelling for the PostgreSQL estate, including migration between Insight 1.0 and 2.0. His work spans conformance and audit assessments through to deployment architecture blueprinting for high-stakes, regulated data platforms.
    
    Hari is a regular Speaker at PostgreSQL and open-source conferences, where he shares practical insights on database modernization, PostgreSQL adoption, cloud-native architectures, and startup journeys. Beyond industry engagement, he serves as an Adjunct Professor, mentoring the next generation of technology professionals.
    Prior to founding OpenSource DB, Hari held leadership and database SME roles at global organizations including GE, Oracle, Optum, 2ndQuadrant, and EDB. His unique blend of enterprise experience, community leadership, and entrepreneurial mindset enables him to bridge the gap between technology, business outcomes, and open-source innovation.

