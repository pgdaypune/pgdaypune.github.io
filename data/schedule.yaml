- start: "🕘 TBD"
  end: "TBD"
  title: "🎙️ Keynote: Postgres 30 Years In: How We Got Here and Where We Are Going"
  speaker: "Tom Kincaid"
  abstract: >-
    Tom will trace Postgres's evolution from a niche database to the gold standard for modern application development — the early technical decisions, key milestones, and community shifts that drove its adoption. He'll then look ahead to how Postgres 19 is expanding the database's capabilities for mission-critical deployments and developer productivity, why Postgres has become the platform of choice for AI and LLM application development, and the challenges the project must tackle to stay there.

- start: "🕘 TBD"
  end: "TBD"
  title: "Postgres as the System of Record for AI Agents: Memory, State, and Tool Outputs"
  speaker: "Abhishek Oberoi, Nadeem Khan"
  abstract: >-
    AI agents need durable memory, transactional state, and an audit trail for tool calls. Most agent frameworks do not start there. They keep conversation history in JSON files, scratch state in Redis, and embeddings in a separate vector store, while PostgreSQL holds only the business data. That split is easy to ship as a prototype. It becomes hard to operate when a tool call fails halfway through a workflow: there is no single place to see what ran, what is still pending, and what is safe to retry.


    This talk makes the case for PostgreSQL as the backbone of an agentic system. If an agent is going to remember, act, and be reviewed later, those records belong in a database that can store mixed shapes, retrieve similar memories, isolate tenants, and commit or roll back as a unit.
    We will cover four PostgreSQL capabilities in that role. JSONB holds tool arguments and results when each tool has a different payload. pgvector sits on the same memory rows so semantic recall is a query next to structured state, not a call to a second product. Row-level security isolates tenants and agents the way application data is already isolated. Transactions keep agent state consistent when a tool call does not finish, so a failed step does not leave half-written history behind.


    The session walks through a reference architecture and the schema behind it. Conversations, tool calls, and long-term memory are first-class tables. We will look at how those tables relate: what belongs in a real column, what can stay in JSONB, and how semantic memory can live beside status, timestamps, and tenant keys in one database.


    We close with the trade-offs in that design: where PostgreSQL is the right system of record, and where a cache or object store still makes sense. Attendees should leave knowing why a vector store alone is not enough, and how PostgreSQL can hold memory, state, and tool outputs together.

- start: "🕘 TBD"
  end: "TBD"
  title: "Logical Failover Slots: Keeping Replication Alive Through a Failover"
  speaker: "Ashutosh Sharma"
  abstract: |
    PostgreSQL 17 introduces Logical Failover Slots, a feature that lets physical standbys synchronize logical replication slots from the primary so when a failover happens, the newly promoted primary already has the logical slots intact, and downstream subscribers can pick up right where they left off instead of requiring a full resync.

    This talk starts with a quick refresher on logical replication and logical slots, then dives into the new feature: how slot synchronization works under the hood, which parameters need to be tuned to enable it, and how to verify that a slot is synced and will actually survive a failover. It's a short, practical session touching on all the pieces you need to put this feature to work.

