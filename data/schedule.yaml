  title: "🎙️ Keynote: Postgres 30 Years In: How We Got Here and Where We Are Going"
  speaker: "Tom Kincaid"
  abstract: >-
    Tom will trace Postgres's evolution from a niche database to the gold standard for modern application development — the early technical decisions, key milestones, and community shifts that drove its adoption. He'll then look ahead to how Postgres 19 is expanding the database's capabilities for mission-critical deployments and developer productivity, why Postgres has become the platform of choice for AI and LLM application development, and the challenges the project must tackle to stay there.

