chapter:
  title: "Part of PGConf India's City Chapter Network"
  logo: "/images/pgconf-logo.png"
  url: "https://pgconf.in/"
  body: >-
    The India PostgreSQL User Group (IPUG) has promoted PostgreSQL through PGConf
    India for over a decade. To broaden its reach, IPUG runs local city chapters —
    regional extensions that give PostgreSQL users and organizations localized
    access to funds, resources, knowledge and community support. PgPune is proud
    to be the Pune city chapter of that national mission.
