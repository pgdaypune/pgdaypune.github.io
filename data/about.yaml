# Drives the /about/ page (hugo.Data.about) — data-driven, no markdown body.
intro: >-
  PgPune is run by the Pune PostgreSQL User Group — a community of engineers,
  DBAs and open-source enthusiasts. Every edition is made possible by organizers,
  volunteers and participants who show up to grow PostgreSQL in the region.
contactEmail: "pgdaypune@gmail.com"

