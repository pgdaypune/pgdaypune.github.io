# Drives the /about/ page (hugo.Data.about) — data-driven, no markdown body.
intro: >-
  Our PostgreSQL events are made possible by the dedication and enthusiasm of our incredible team and community members.
  From organizers to volunteers and participants, every individual plays a vital role in fostering growth and collaboration.
contactEmail: "pgdaypune@gmail.com"

# Home-page community blurb (rendered as-is; contains one inline link).
about: >-
  PgPune is hosted by the
  <a class="spoke-ev" href="https://www.linkedin.com/groups/9884249/" target="_blank" rel="noopener">Pune PostgreSQL User Group</a>,
  a community of engineers, DBAs, and open-source enthusiasts on a mission to grow PostgreSQL adoption in the region.
  Each edition brings together practitioners for talks, round-table discussions, and hands-on networking, entirely community-run.

