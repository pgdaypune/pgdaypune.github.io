baseURL: https://pgpune.in
locale: en-us
title: Postgres Pune
RelativeURLs: true
CanonifyURLs: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: true   # event pages carry their real (often future) date in frontmatter
buildExpired: false

minify:
  disableXML: true

markup:
  goldmark:
    renderer:
      unsafe: true      # templates render trusted HTML via safeHTML / markdownify
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - JSON              # search index — fastsearch.js fetches /index.json

params:
  env: production       # gates analytics + OpenGraph/schema (head.html, analytics.html)
  # Current-edition data lives in data/event.yaml (hugo.Data.event).
  description: "Postgres Pune is proudly hosted by the Pune PostgreSQL User Group, with a mission to grow and strengthen the PostgreSQL community across India."
  keywords: [Postgres, Pune, Postgresql, PgPune, PGDay, PostgreSQL User Group, Pune PostgreSQL User Group, India, Community, Meetup, Conference, Event, Database, Open Source]
  images: ["https://pgpune.in/images/pgpune.png"]   # default OG / Twitter card image

  # Client-side search (Fuse.js) — consumed by layouts/_default/search.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: false
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    findAllMatches: true
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

services:
  googleAnalytics:
    ID: G-407ZB9J08X
